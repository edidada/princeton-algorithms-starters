name: Princeton kdtree
on:
  push:
    branches: [edidada/kdtree]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon test
      - name: Render points and splitting lines
        working-directory: kdtree
        run: xvfb-run -a java -cp target/classes:target/test-classes:.lift/algs4.jar DrawSmoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kdtree-test-results
          path: |
            kdtree/target/surefire-reports/
            kdtree/build/test-results/
            kdtree/target/*.png

name: Princeton percolation
on:
  push:
    branches: [edidada/percolation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon test
      - run: java -cp percolation/target/classes:percolation/.lift/algs4.jar PercolationStats 30 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: percolation-test-results
          path: |
            percolation/target/surefire-reports/
            percolation/build/test-results/

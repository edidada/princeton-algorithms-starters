name: Princeton queues
on:
  push:
    branches: [edidada/queues]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_permutation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queues-test-results
          path: |
            queues/target/surefire-reports/
            queues/build/test-results/
